<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Meteoblue integration for Gladys Assistant (illustration,
       no meteoblue logo). Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#1b6ca8"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- title -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="60" y="98" font-size="54" font-weight="bold" fill="#ffffff">Meteoblue</text>
    <text x="62" y="136" font-size="22" fill="#cfe3f7">for Gladys Assistant</text>
  </g>

  <!-- small sun and cloud -->
  <circle cx="660" cy="92" r="34" fill="#ffca3a"/>
  <g stroke="#ffca3a" stroke-width="6" stroke-linecap="round">
    <path d="M660 42 v-14 M660 142 v14 M610 92 h-14 M710 92 h14"/>
    <path d="M625 57 l-10 -10 M695 127 l10 10 M625 127 l-10 10 M695 57 l10 -10"/>
  </g>
  <g fill="#ffffff">
    <circle cx="672" cy="122" r="26"/>
    <circle cx="704" cy="110" r="32"/>
    <circle cx="736" cy="126" r="22"/>
    <rect x="650" y="122" width="108" height="28" rx="14"/>
  </g>

  <!-- meteogram-like card -->
  <rect x="64" y="178" width="680" height="296" rx="22" fill="#000000" opacity="0.25"/>
  <rect x="60" y="170" width="680" height="296" rx="22" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#5c6b7a" text-anchor="middle">
    <text x="128" y="204">Tue</text>
    <text x="219" y="204">Wed</text>
    <text x="310" y="204">Thu</text>
    <text x="401" y="204">Fri</text>
    <text x="492" y="204">Sat</text>
    <text x="583" y="204">Sun</text>
    <text x="674" y="204">Mon</text>
  </g>
  <g stroke="#e3e8ee" stroke-width="1">
    <path d="M173 216 v226 M264 216 v226 M355 216 v226 M446 216 v226 M537 216 v226 M628 216 v226"/>
  </g>
  <!-- temperature curve -->
  <path d="M84 300 C 110 270, 150 250, 175 262 S 230 300, 266 296 S 320 340, 356 352 S 410 372, 446 344 S 500 300, 538 292 S 600 280, 630 276 S 690 270, 716 280 L 716 384 L 84 384 Z" fill="url(#warm)"/>
  <path d="M84 300 C 110 270, 150 250, 175 262 S 230 300, 266 296 S 320 340, 356 352 S 410 372, 446 344 S 500 300, 538 292 S 600 280, 630 276 S 690 270, 716 280" fill="none" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>
  <!-- precipitation bars -->
  <g fill="#2f80ed">
    <rect x="120" y="408" width="10" height="26" rx="2"/>
    <rect x="134" y="392" width="10" height="42" rx="2"/>
    <rect x="148" y="400" width="10" height="34" rx="2"/>
    <rect x="162" y="420" width="10" height="14" rx="2"/>
    <rect x="388" y="418" width="10" height="16" rx="2"/>
    <rect x="402" y="424" width="10" height="10" rx="2"/>
  </g>
  <!-- freezing line and frost mark -->
  <path d="M84 360 H 716" stroke="#8ec5ff" stroke-width="2" stroke-dasharray="6 6"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#3a7bd5">
    <text x="690" y="378" text-anchor="end">0 °C</text>
  </g>
  <g stroke="#3a7bd5" stroke-width="3" stroke-linecap="round">
    <path d="M356 374 v18 M348 379 l16 8 M348 387 l16 -8"/>
  </g>
  <!-- predictability dots -->
  <g fill="#1a7f37">
    <circle cx="128" cy="452" r="5"/><circle cx="219" cy="452" r="5"/><circle cx="310" cy="452" r="5"/>
  </g>
  <g fill="#bc6c00">
    <circle cx="401" cy="452" r="5"/><circle cx="492" cy="452" r="5"/>
  </g>
  <g fill="#cf222e">
    <circle cx="583" cy="452" r="5"/><circle cx="674" cy="452" r="5"/>
  </g>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#cfe3f7">
    <text x="60" y="504">7-day forecast · rain and frost scenes · meteogram · credits</text>
  </g>
</svg>
